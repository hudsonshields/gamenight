<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-Ball Pool – GameNight</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .pool-wrap { display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 920px; width: 100%; }
    #poolCanvas { max-width: 100%; height: auto; border-radius: 10px; cursor: crosshair; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
    .pool-info { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    .assign-label { font-size: .9rem; color: #a0a0c0; font-weight: 600; }
    .pocketed-row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; min-height: 28px; }
    .pocketed-ball {
      width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 10px; font-weight: 800; color: #fff;
      background: var(--ball-color); border: 2px solid rgba(255,255,255,.15);
    }
    .pocketed-ball.stripe {
      background: radial-gradient(circle, #fff 30%, var(--ball-color) 31%);
      color: #000;
    }
  </style>
</head>
<body>
  <div class="game-page" id="app">
    <div class="game-topbar">
      <a href="/" class="back-btn">← Back</a>
      <span class="game-title">🎱 8-Ball Pool</span>
      <div class="score-display">
        <span class="score-you" id="scoreYou">0</span>
        <span class="score-sep">–</span>
        <span class="score-opp" id="scoreOpp">0</span>
      </div>
    </div>

    <!-- Waiting -->
    <div id="screen-waiting" class="waiting-screen">
      <div class="spinner"></div>
      <h2>Waiting for opponent…</h2>
      <p>Share this room code with your partner</p>
      <div class="room-code-box">
        <div class="label">Room Code</div>
        <div class="code" id="displayCode">——</div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">📋 Copy Invite Link</button>
    </div>

    <!-- Game -->
    <div id="screen-game" style="display:none;" class="pool-wrap">
      <div class="status-banner" id="statusBanner">–</div>
      <canvas id="poolCanvas" width="900" height="500"></canvas>
      <div class="pool-info">
        <span class="assign-label" id="assignmentInfo">Pocket a ball to get assigned!</span>
      </div>
      <div class="pocketed-row" id="pocketedBalls"></div>
    </div>

    <!-- Game Over -->
    <div id="screen-gameover" class="gameover-overlay" style="display:none;">
      <div class="gameover-card">
        <div class="gameover-emoji" id="goEmoji">🏆</div>
        <div class="gameover-title" id="goTitle">You Win!</div>
        <div class="gameover-sub" id="goSub"></div>
        <div class="gameover-scores">
          <div class="player">
            <div class="player-score score-you" id="goScoreYou">0</div>
            <div class="player-label">You</div>
          </div>
          <div class="player">
            <div class="player-score score-opp" id="goScoreOpp">0</div>
            <div class="player-label">Them</div>
          </div>
        </div>
        <button class="gameover-btn" onclick="sendRematch()">🔁 Rematch</button>
        <button class="gameover-btn secondary" onclick="window.location.href='/'">🏠 Lobby</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
