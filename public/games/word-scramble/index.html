<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Scramble – GameNight</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="game-page" id="app">
    <div class="game-topbar">
      <a href="/" class="back-btn">← Back</a>
      <span class="game-title">🔤 Word Scramble</span>
      <div class="score-display">
        <span class="score-you" id="scoreYou">0</span>
        <span class="score-sep">–</span>
        <span class="score-opp" id="scoreOpp">0</span>
      </div>
    </div>

    <!-- Waiting -->
    <div id="screen-waiting" class="waiting-screen">
      <div class="spinner"></div>
      <h2>Waiting for opponent…</h2>
      <p>Share this room code with your partner</p>
      <div class="room-code-box">
        <div class="label">Room Code</div>
        <div class="code" id="displayCode">——</div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">📋 Copy Invite Link</button>
    </div>

    <!-- Game -->
    <div id="screen-game" style="display:none;" class="ws-container">
      <div class="ws-round" id="roundLabel">Round 1 of 5</div>

      <div class="status-banner your-turn" id="statusBanner">Unscramble the word first!</div>

      <div class="ws-scrambled" id="scrambledWord">——</div>

      <div class="ws-scores-row">
        <div class="ws-player">
          <div class="ws-player-score score-you" id="wsScoreYou">0</div>
          <div class="ws-player-label">You</div>
        </div>
        <div class="ws-player">
          <div class="ws-player-score score-opp" id="wsScoreOpp">0</div>
          <div class="ws-player-label">Them</div>
        </div>
      </div>

      <div id="revealArea" style="min-height:2rem;"></div>

      <div class="ws-input-row" id="inputRow">
        <input
          class="ws-input"
          id="guessInput"
          type="text"
          placeholder="YOUR GUESS"
          autocomplete="off"
          spellcheck="false"
          autocorrect="off"
          maxlength="20"
        />
        <button class="ws-submit" onclick="submitGuess()">Go!</button>
      </div>
    </div>

    <!-- Game Over -->
    <div id="screen-gameover" class="gameover-overlay" style="display:none;">
      <div class="gameover-card">
        <div class="gameover-emoji" id="goEmoji">🏆</div>
        <div class="gameover-title" id="goTitle">You Win!</div>
        <div class="gameover-sub" id="goSub"></div>
        <div class="gameover-scores">
          <div class="player">
            <div class="player-score score-you" id="goScoreYou">0</div>
            <div class="player-label">You</div>
          </div>
          <div class="player">
            <div class="player-score score-opp" id="goScoreOpp">0</div>
            <div class="player-label">Them</div>
          </div>
        </div>
        <button class="gameover-btn" onclick="sendRematch()">🔁 Rematch</button>
        <button class="gameover-btn secondary" onclick="window.location.href='/'">🏠 Lobby</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
