<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Four – GameNight</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="game-page" id="app">
    <div class="game-topbar">
      <a href="/" class="back-btn">← Back</a>
      <span class="game-title">🔴 Connect Four</span>
      <div class="score-display">
        <span class="score-you" id="scoreYou">0</span>
        <span class="score-sep">–</span>
        <span class="score-opp" id="scoreOpp">0</span>
      </div>
    </div>

    <div id="screen-waiting" class="waiting-screen">
      <div class="spinner"></div>
      <h2>Waiting for opponent…</h2>
      <p>Share this room code with your partner</p>
      <div class="room-code-box">
        <div class="label">Room Code</div>
        <div class="code" id="displayCode">——</div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">📋 Copy Invite Link</button>
    </div>

    <div id="screen-game" style="display:none; text-align:center;">
      <div class="status-banner" id="statusBanner">–</div>
      <div class="cf-col-btns" id="colBtns"></div>
      <div class="cf-board" id="cfBoard"></div>
    </div>

    <div id="screen-gameover" class="gameover-overlay" style="display:none;">
      <div class="gameover-card">
        <div class="gameover-emoji" id="goEmoji">🏆</div>
        <div class="gameover-title" id="goTitle">You Win!</div>
        <div class="gameover-sub" id="goSub"></div>
        <div class="gameover-scores">
          <div class="player">
            <div class="player-score score-you" id="goScoreYou">0</div>
            <div class="player-label">You</div>
          </div>
          <div class="player">
            <div class="player-score score-opp" id="goScoreOpp">0</div>
            <div class="player-label">Them</div>
          </div>
        </div>
        <button class="gameover-btn" onclick="sendRematch()">🔁 Rematch</button>
        <button class="gameover-btn secondary" onclick="window.location.href='/'">🏠 Lobby</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
