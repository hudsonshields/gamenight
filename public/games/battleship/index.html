<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battleship – GameNight</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="game-page" id="app">
    <div class="game-topbar">
      <a href="/" class="back-btn">← Back</a>
      <span class="game-title">🚢 Battleship</span>
      <div class="score-display">
        <span class="score-you" id="scoreYou">0</span>
        <span class="score-sep">–</span>
        <span class="score-opp" id="scoreOpp">0</span>
      </div>
    </div>

    <!-- Waiting -->
    <div id="screen-waiting" class="waiting-screen">
      <div class="spinner"></div>
      <h2>Waiting for opponent…</h2>
      <p>Share this room code with your partner</p>
      <div class="room-code-box">
        <div class="label">Room Code</div>
        <div class="code" id="displayCode">——</div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">📋 Copy Invite Link</button>
    </div>

    <!-- Placement -->
    <div id="screen-placement" style="display:none;" class="bs-container">
      <div class="status-banner waiting" id="placementStatus">Place your ships!</div>
      <div class="bs-placement">
        <div style="display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; justify-content:center;">
          <span style="font-size:.85rem; color:#a0a0c0;">Ship:</span>
          <div class="bs-ships-list" id="shipsList"></div>
          <button class="bs-orient-btn" id="orientBtn" onclick="toggleOrientation()">↔ Horizontal</button>
        </div>
        <p style="font-size:.8rem; color:#a0a0c0;">Click the grid to place selected ship</p>
        <div class="bs-grid-wrap">
          <div class="bs-grid-label">Your Fleet</div>
          <div class="bs-grid" id="placementGrid"></div>
        </div>
        <button class="action-btn" id="confirmPlaceBtn" onclick="confirmPlacement()" disabled>✅ Confirm Placement</button>
      </div>
    </div>

    <!-- Battle -->
    <div id="screen-battle" style="display:none;" class="bs-container">
      <div class="status-banner" id="battleStatus">–</div>
      <div class="bs-grids">
        <div class="bs-grid-wrap">
          <div class="bs-grid-label">Your Fleet</div>
          <div class="bs-grid" id="myGrid"></div>
        </div>
        <div class="bs-grid-wrap">
          <div class="bs-grid-label">Enemy Waters</div>
          <div class="bs-grid" id="oppGrid"></div>
        </div>
      </div>
      <div style="font-size:.85rem; color:#a0a0c0;" id="sinkStatus"></div>
    </div>

    <!-- Game Over -->
    <div id="screen-gameover" class="gameover-overlay" style="display:none;">
      <div class="gameover-card">
        <div class="gameover-emoji" id="goEmoji">🏆</div>
        <div class="gameover-title" id="goTitle">You Win!</div>
        <div class="gameover-sub" id="goSub"></div>
        <div class="gameover-scores">
          <div class="player">
            <div class="player-score score-you" id="goScoreYou">0</div>
            <div class="player-label">You</div>
          </div>
          <div class="player">
            <div class="player-score score-opp" id="goScoreOpp">0</div>
            <div class="player-label">Them</div>
          </div>
        </div>
        <button class="gameover-btn" onclick="sendRematch()">🔁 Rematch</button>
        <button class="gameover-btn secondary" onclick="window.location.href='/'">🏠 Lobby</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
